<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>样品测试弹窗浏览器验收</title><style>body{margin:12px;font:14px system-ui}nav{display:flex;flex-wrap:wrap;gap:14px;padding-bottom:10px}iframe{border:1px solid #888;display:block}pre{white-space:pre-wrap;margin:8px 0}</style></head><body><nav><a href="?mode=assign">桌面分派</a><a href="?mode=assign&size=mobile">窄屏分派</a><a href="?mode=assign&size=mobile&failure=1">分派失败恢复</a><a href="?mode=confirm">桌面研发确认</a><a href="?mode=confirm&size=mobile">窄屏研发确认</a><a href="?mode=confirm&size=mobile&failure=1">确认失败恢复</a></nav><iframe id="sample-frame" title="真实样品测试弹窗"></iframe><pre id="sample-result" aria-live="polite"></pre><pre id="sample-requests" aria-live="polite"></pre><pre id="sample-metrics"></pre><script>const params=new URLSearchParams(location.search);const frame=document.getElementById('sample-frame');[frame.width,frame.height]=params.get('size')==='mobile'?[390,844]:[1200,800];frame.src='./sample-test-frame.html?'+params;const requests=[];addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data;if(data.kind==='sample-request'){requests.push(data.request);document.getElementById('sample-requests').textContent=JSON.stringify(requests)}if(data.kind==='sample-result')document.getElementById('sample-result').textContent=data.result;if(data.kind==='sample-layout')document.getElementById('sample-metrics').textContent=JSON.stringify(data.layout)});</script></body></html>
