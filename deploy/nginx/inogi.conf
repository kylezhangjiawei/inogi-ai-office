# INOGI AI Office —— nginx 站点配置
#
# 部署：把本文件放到 /etc/nginx/conf.d/inogi.conf（或 sites-available/ 并软链到 sites-enabled/），
#       改好 server_name 和 root，然后：  nginx -t && nginx -s reload
#
# 解决「发版后用户要清浏览器缓存」的核心思路：
#   - index.html 永不缓存：用户每次访问都会重新校验，永远拿到引用「新 hash 资源」的入口页。
#   - /assets/ 下带内容 hash 的 JS/CSS：永久强缓存。文件名变了浏览器才会重新下载，
#     既不会用到旧代码，又能最大化缓存命中、加载快。
#   （Vite 已默认给 /assets/ 产物加内容 hash，见 vite.config.ts。）

server {
    listen 80;
    listen [::]:80;
    server_name _;            # ← 改成你的域名，例如 office.example.com（没有域名就保留 _）

    # 前端构建产物目录（仓库里的 dist）
    root /opt/inogi-ai-office-system/dist;
    index index.html;

    # 允许较大上传 / JSON（研发数据表路由后端限制 50mb）
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml application/wasm image/svg+xml font/woff2;

    # 1) 带 hash 的静态资源：永久强缓存
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2) 后端 API 反向代理（生产环境的 /api 转发；vite.config 里的 proxy 仅 dev 生效）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3) 入口 HTML + SPA 路由回退：永不缓存（发版即时生效的关键）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }
}

# ───────────────────────────────────────────────────────────────────
# 如需 HTTPS：用 certbot 自动管理证书（推荐）
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d office.example.com
# certbot 会自动在本 server 块上补 443/证书，并把 80 重定向到 443。
# ───────────────────────────────────────────────────────────────────
