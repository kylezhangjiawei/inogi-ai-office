packages:
  - '.'
  - 'apps/*'

confirmModulesPurge: false

# 这些钉死的版本是安全补丁版，不是随手写的。改动前先查 pnpm audit：
# 钉在低于修复版的版本上，等于用配置把漏洞锁住（2026-08 就发生过：
# vite 6.3.5 与 linkify-it 5.0.1 恰好都停在各自最后一个受影响版本）。
overrides:
  vite: 6.4.3
  linkify-it: 5.0.2
  multer: 2.3.0
  nodemailer: 9.1.1
  protobufjs: 7.6.5
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.9
  'ip-address@10': 10.3.1
  'nanoid@5': 5.1.16
  'nanoid@3': 3.3.18
  'qs@6': 6.16.0
  '@xmldom/xmldom@0.8': 0.8.15
  'fflate@0.4': 0.4.9
  # Prisma 6 loads deepmerge only as its configuration merger; validate CLI compatibility on upgrades.
  '@prisma/config>deepmerge-ts': 8.0.0
  'html-to-text>deepmerge-ts': 8.0.0
  'postcss@8': 8.5.23
  'fast-uri@3': 3.1.6
  'js-yaml@4': 4.3.2
  'tar@7': 7.5.21
  'browserslist@4': 4.28.7
  'baseline-browser-mapping@2': 2.11.0
  uuid: 11.1.1

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true

# pnpm v10 默认屏蔽依赖的构建脚本（含原生模块的安装脚本）。
# 这里显式允许这些包运行构建/安装脚本，否则 argon2（登录密码哈希）、
# prisma 引擎、tailwind oxide 等原生依赖可能装不全、运行时报错。
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - prisma
