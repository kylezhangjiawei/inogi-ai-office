packages:
  - '.'
  - 'apps/*'

confirmModulesPurge: false

# 这些钉死的版本是安全补丁版，不是随手写的。改动前先查 pnpm audit：
# 钉在低于修复版的版本上，等于用配置把漏洞锁住（2026-08 就发生过：
# vite 6.3.5 与 linkify-it 5.0.1 恰好都停在各自最后一个受影响版本）。
overrides:
  vite: 6.4.3
  linkify-it: 5.0.2
  multer: 2.2.0
  nodemailer: 9.0.1
  protobufjs: 7.6.3
  uuid: 11.1.1

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true

# pnpm v10 默认屏蔽依赖的构建脚本（含原生模块的安装脚本）。
# 这里显式允许这些包运行构建/安装脚本，否则 argon2（登录密码哈希）、
# prisma 引擎、tailwind oxide 等原生依赖可能装不全、运行时报错。
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - argon2
  - esbuild
  - prisma
